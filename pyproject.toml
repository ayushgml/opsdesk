[project]
name = "opsdesk"
version = "1.0.0"
description = "A local incident-response assistant with deterministic tool evaluation"
requires-python = ">=3.12,<3.13"
dependencies = ["anthropic>=0.40,<1", "openai>=1.60,<3", "pydantic>=2.10,<3"]

[dependency-groups]
dev = ["pytest>=8,<9"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
